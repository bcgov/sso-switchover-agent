name: Rotate Gold Patroni credentials

on:
  workflow_dispatch:
    inputs:
      project:
        description: "The target project"
        type: choice
        required: true
        options: ["SANDBOX", "PRODUCTION"]
        default: "SANDBOX"
      environment:
        description: "env to rotate"
        type: choice
        options: ["dev", "test", "prod"]
        default: "dev"
      dry_run:
        description: "Preview the planned actions without mutating anything"
        type: boolean
        default: true
      finalize_appuser_rotation:
        description: "Run the finalize step instead (drops the old appuser role). Only use this on a later, separate run once the new appuser credential is confirmed working everywhere."
        type: boolean
        default: false

jobs:
  rotate-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
      - name: Install CLI tools from OpenShift Mirror
        uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82 #v1.13.1
        with:
          source: "mirror"
          kam: "latest"
          oc: "4"
      - name: Set the deployment namespace
        run: |
          chmod +x ./namespace-setter.sh
          ./namespace-setter.sh ${{ github.event.inputs.project }} ${{ github.event.inputs.environment }}
        working-directory: .github/helpers

      # This rotation intentionally only touches the Gold cluster (GoldDR is
      # out of scope) so we log in there directly instead of reusing the
      # Gold+GoldDR oc-login composite action.
      - name: Login Openshift Gold
        uses: redhat-actions/oc-login@5eb45e848b168b6bf6b8fe7f1561003c12e3c99d #v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER_GOLD }}
          openshift_token: ${{ secrets[format('OPENSHIFT_TOKEN_GOLD_{0}', github.event.inputs.project)] }}
          namespace: ${{ env.NAMESPACE }}
          insecure_skip_tls_verify: true

      - name: Run credential rotation script
        run: |
          echo "Running on the $NAMESPACE namespace"
          chmod +x ./rotate-credentials.sh

          dry_run_flag="--no-dry-run"
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            dry_run_flag="--dry-run"
          fi

          finalize_flag=""
          if [[ "${{ github.event.inputs.finalize_appuser_rotation }}" == "true" ]]; then
            finalize_flag="--finalize"
          fi

          # shellcheck disable=SC2086
          ./rotate-credentials.sh "$NAMESPACE" "$dry_run_flag" $finalize_flag
        working-directory: credential-rotation
