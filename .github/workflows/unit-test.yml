name: Run Python Tests

on: [push, pull_request]

jobs:
  run_python_tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: hmarr/debug-action@cd1afbd7852b7ad7b1b7a9a1b03efebd3b0a1820 # v3.0.0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install asdf requirements
        run: |
          sudo apt-get install -y libssl-dev libreadline-dev uuid-dev
      - name: Setup asdf
        uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - name: Cache asdf tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/runner/.asdf
          key: ${{ runner.os }}-${{ hashFiles('**/.tool-versions') }}

      - name: Install asdf
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      - name: Install python requirements
        run: |
          pip install -r requirements.txt
          asdf reshim

      - name: Run frontend unit tests
        run: |
          pytest src/tests/trigger_test.py
        working-directory: ./
