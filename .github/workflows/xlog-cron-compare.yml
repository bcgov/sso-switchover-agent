name: "Transaction Log Comparison"

on:
  workflow_dispatch:
jobs:
  xlog-cron:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install CLI tools from OpenShift Mirror
        uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82 # v1.13.1
        with:
          source: "mirror"
          kam: "latest"
          oc: "4"
      - name: Login Openshift Gold & Golddr
        uses: ./.github/actions/oc-login
        with:
          namespace: ${{ github.event.inputs.namespace }}
          oc-server-gold: ${{ secrets.OPENSHIFT_SERVER_GOLD }}
          oc-token-gold: ${{ secrets.OPENSHIFT_TOKEN_GOLD_PRODUCTION }}
          oc-server-golddr: ${{ secrets.OPENSHIFT_SERVER_GOLDDR }}
          oc-token-golddr: ${{ secrets.OPENSHIFT_TOKEN_GOLDDR_PRODUCTION }}

      - name: Run xlog comparison
        run: |
          chmod +x ./xlog-comparison.sh
          ./xlog-comparison.sh
        working-directory: transition-scripts

      - name: Teams Notification
        if: failure()
        uses: fjogeleit/http-request-action@c0b95d02a088b47c1f2f4db04fd8af8bd19eee54 # v1.16.6
        with:
          url: ${{ secrets.SSO_ALERTS }}
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"title": "One of the production xlogs failed to synch","severity": "warning", "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
