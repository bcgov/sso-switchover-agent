name: Login Openshift Gold & Golddr

inputs:
  namespace:
    description: "The namespace to run the scripts"
    required: true
  oc-server-gold:
    description: "The Gold API server url"
    required: true
  oc-token-gold:
    description: "The Gold API server bearer token for authentication"
    required: true
  oc-server-golddr:
    description: "The Golddr API server url"
    required: true
  oc-token-golddr:
    description: "The Golddr API server bearer token for authentication"
    required: true
runs:
  using: composite
  steps:
    - name: Login Gold
      shell: bash
      env:
        OC_SERVER: ${{ inputs.oc-server-gold }}
        OC_TOKEN: ${{ inputs.oc-token-gold }}
        OC_NAMESPACE: ${{ inputs.namespace }}
      run: |
        echo "::add-mask::$OC_TOKEN"
        for attempt in 1 2 3 4 5; do
          if oc login --token="$OC_TOKEN" --server="$OC_SERVER" --insecure-skip-tls-verify=true && oc project "$OC_NAMESPACE"; then
            exit 0
          fi
          echo "Gold login attempt $attempt/5 failed"
          [ "$attempt" -lt 5 ] && sleep 5
        done
        echo "Gold login failed after 5 attempts"
        exit 1

    - name: Login Golddr
      shell: bash
      env:
        OC_SERVER: ${{ inputs.oc-server-golddr }}
        OC_TOKEN: ${{ inputs.oc-token-golddr }}
        OC_NAMESPACE: ${{ inputs.namespace }}
      run: |
        echo "::add-mask::$OC_TOKEN"
        for attempt in 1 2 3 4 5; do
          if oc login --token="$OC_TOKEN" --server="$OC_SERVER" --insecure-skip-tls-verify=true && oc project "$OC_NAMESPACE"; then
            exit 0
          fi
          echo "Golddr login attempt $attempt/5 failed"
          [ "$attempt" -lt 5 ] && sleep 5
        done
        echo "Golddr login failed after 5 attempts"
        exit 1
