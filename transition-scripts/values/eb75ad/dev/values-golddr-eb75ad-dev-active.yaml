    cpu: 4

maintenancePage:
  enabled: true

persistentLog:
  size: 15Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 2
  maxUnavailable:

patroni:
  replicaCount: 3

  persistentVolume:
    size: 18Gi

  podDisruptionBudget:
    enabled: true

  transportServerClaim:
    enabled: false
