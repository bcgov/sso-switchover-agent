    value: "60000"
  - name: PPID_TOKEN_URL
    value: https://idtest.gov.bc.ca/oauth2/token
  - name: PPID_API_URL
    value: https://idtest.gov.bc.ca/iis-apis/v1/ppids
  - name: PPID_BCSC_ISSUER
    value: idtest.gov.bc.ca
  - name: PPID_OTP_ISSUER
    value: test.otp.gov.bc.ca

