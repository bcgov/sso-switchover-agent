replicaCount: 0

additionalServerOptions: >-
  -Djgroups.dns.query=sso-keycloak-ping.eb75ad-prod.svc.cluster.local

extraEnvs:
  - name: KC_HOSTNAME
    value: https://loginproxy.gov.bc.ca/auth/
  - name: KC_HOSTNAME_ADMIN
    value: https://loginproxy.gov.bc.ca/auth/
  - name: QUARKUS_LOG_FILE_ROTATION_MAX_BACKUP_INDEX
    value: "14"
  - name: QUARKUS_LOG_FILE_ROTATION_MAX_FILE_SIZE
    value: 300M
  - name: QUARKUS_LOG_FILE_ROTATION_FILE_SUFFIX
    value: .zip
  - name: KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_CONNECTION_TTL_MILLIS
    value: "300000"
  - name: KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_SOCKET_TIMEOUT_MILLIS
    value: "60000"
  - name: PPID_TOKEN_URL
    value: https://id.gov.bc.ca/oauth2/token
  - name: PPID_API_URL
    value: https://id.gov.bc.ca/iis-apis/v1/ppids
  - name: PPID_BCSC_ISSUER
    value: id.gov.bc.ca
  - name: PPID_OTP_ISSUER
    value: otp.gov.bc.ca

resources:
  requests:
    cpu: 500m

persistentLog:
  size: 20Gi

maintenancePage:
  enabled: true
  active: true

patroni:
  replicaCount: 3

  persistentVolume:
    size: 30Gi

  podDisruptionBudget:
    enabled: false

  transportServerClaim:
    enabled: false

  resources:
    limits:
      cpu: 500m
      memory: 4Gi
    requests:
      cpu: 50m
      memory: 2.5Gi
