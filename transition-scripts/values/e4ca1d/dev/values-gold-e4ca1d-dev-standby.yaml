replicaCount: 0

image:
  pullPolicy: Always

additionalServerOptions: >-
  -Djgroups.dns.query=sso-keycloak-ping.e4ca1d-dev.svc.cluster.local

extraEnvs:
  - name: KC_HOSTNAME
    value: https://dev.sandbox.loginproxy.gov.bc.ca/auth/
  - name: KC_HOSTNAME_ADMIN
    value: https://dev.sandbox.loginproxy.gov.bc.ca/auth/
  - name: QUARKUS_LOG_FILE_ROTATION_MAX_BACKUP_INDEX
    value: "42"
  - name: QUARKUS_LOG_FILE_ROTATION_MAX_FILE_SIZE
    value: 1M
  - name: QUARKUS_LOG_FILE_ROTATION_FILE_SUFFIX
    value: .zip
  - name: KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_CONNECTION_TTL_MILLIS
    value: "300000"
  - name: KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_SOCKET_TIMEOUT_MILLIS
    value: "60000"
  - name: PPID_TOKEN_URL
    value: https://idsit.gov.bc.ca/oauth2/token
  - name: PPID_API_URL
    value: https://idsit.gov.bc.ca/iis-apis/v1/ppids
  - name: PPID_BCSC_ISSUER
    value: idsit.gov.bc.ca
  - name: PPID_OTP_ISSUER
    value: urn:ca:bc:gov:idimwebtests:f2ac23eb-eaa5-4640-93b7-187edbda4b31

resources:
  requests:
    cpu: 100m

patroni:
  replicaCount: 3

  persistentVolume:
    size: 1Gi

  podDisruptionBudget:
    enabled: false

  transportServerClaim:
    enabled: true
