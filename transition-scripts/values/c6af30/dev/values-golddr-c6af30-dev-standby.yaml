replicaCount: 0

additionalServerOptions: >-
  -Dkeycloak.profile.feature.impersonation=disabled
  -Djboss.persistent.log.dir=/var/log/eap
  -Djgroups.dns.query=sso-keycloak-ping.c6af30-dev.svc.cluster.local

extraEnvs:
  - name: QUARKUS_LOG_FILE_ROTATION_MAX_BACKUP_INDEX
    value: "42"
  - name: QUARKUS_LOG_FILE_ROTATION_MAX_FILE_SIZE
    value: 1M
  - name: QUARKUS_LOG_FILE_ROTATION_FILE_SUFFIX
    value: .zip
  # There are no vanity urls in c6
  - name: KC_HOSTNAME_URL
    value: https://sso-keycloak-c6af30-dev.apps.golddr.devops.gov.bc.ca/auth/
  - name: KC_HOSTNAME_ADMIN_URL
    value: https://sso-keycloak-c6af30-dev.apps.golddr.devops.gov.bc.ca/auth/
  - name: PPID_TOKEN_URL
    value: https://idsit.gov.bc.ca/oauth2/token
  - name: PPID_API_URL
    value: https://idsit.gov.bc.ca/iis-apis/v1/ppids
  - name: PPID_BCSC_ISSUER
    value: idsit.gov.bc.ca
  - name: PPID_OTP_ISSUER
    value: urn:ca:bc:gov:idimwebtests:f2ac23eb-eaa5-4640-93b7-187edbda4b31

maintenancePage:
  enabled: true
  active: true

patroni:
  replicaCount: 3

  persistentVolume:
    size: 8Gi

  podDisruptionBudget:
    enabled: false

  transportServerClaim:
    enabled: false
